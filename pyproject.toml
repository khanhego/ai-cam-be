[project]
name = "aicam"
version = "0.1.0"
description = "Hệ thống X — ghi hình và đối soát đóng gói (backend: api, worker, beat, vision)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "zxing-cpp>=3.1.1",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.3",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "boto3>=1.35",
]

[project.scripts]
aicam = "aicam.entrypoints.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "respx>=0.23.1",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicam"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép chữ tiếng Việt trong chuỗi / comment

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501", "UP035", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aicam"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: cần PostgreSQL thật (TEST_DATABASE_URL)",
    "qa: QA trên stack dev thật (QA_BASE_URL)",
    "perf: hiệu năng dữ liệu lớn, chạy riêng (RUN_PERF=1)",
]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette.testclient"]

[tool.importlinter]
root_package = "aicam"

[[tool.importlinter.contracts]]
name = "core không phụ thuộc module nghiệp vụ"
type = "forbidden"
source_modules = ["aicam.core"]
forbidden_modules = ["aicam.modules", "aicam.realtime", "aicam.workers", "aicam.entrypoints"]

[[tool.importlinter.contracts]]
name = "module nghiệp vụ không import entrypoints"
type = "forbidden"
source_modules = ["aicam.modules"]
forbidden_modules = ["aicam.entrypoints"]

[[tool.importlinter.contracts]]
name = "cloud không import module nghiệp vụ (DEC-463)"
type = "forbidden"
source_modules = ["aicam.modules.cloud"]
forbidden_modules = [
    "aicam.modules.approvals", "aicam.modules.backup", "aicam.modules.claims", "aicam.modules.imports",
    "aicam.modules.media", "aicam.modules.notify", "aicam.modules.orders", "aicam.modules.platforms",
    "aicam.modules.reconciliation", "aicam.modules.reports", "aicam.modules.returns", "aicam.modules.sessions",
    "aicam.modules.settings", "aicam.modules.shares", "aicam.modules.stations", "aicam.modules.users",
    "aicam.modules.vision", "aicam.realtime", "aicam.workers",
]
