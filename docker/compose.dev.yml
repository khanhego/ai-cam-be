# Môi trường dev. Port host lệch chuẩn để không đụng dự án khác trên cùng máy.
# Chạy: docker compose -f docker/compose.dev.yml up --build
name: aicam-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aicam
      POSTGRES_USER: aicam
      POSTGRES_PASSWORD: aicam
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicam -d aicam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Volume video thuộc uid 10001 (user `aicam` trong image): worker ghi clip / bản xuất, J-02 xóa video thô.
  # MediaMTX chạy cùng uid để file nó ghi xóa được (T-14).
  video-init:
    image: alpine:3
    # Volume imports: file CSV / xlsx gốc (T-17, API-50/54; J-11 xóa sau 90 ngày).
    command: ["sh", "-c", "mkdir -p /data/video/raw /data/video/clips /data/video/exports && chown -R 10001:10001 /data/video /data/imports"]
    volumes: [video:/data/video, imports:/data/imports]

  mediamtx:
    image: bluenviron/mediamtx:1
    user: "10001:10001"
    depends_on:
      video-init: { condition: service_completed_successfully }
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - video:/data/video
    ports:
      - "58554:8554"   # RTSP
      - "58889:8889"   # WebRTC / WHEP
      - "8189:8189/udp" # WebRTC ICE (cổng phải trùng trong và ngoài vì nằm trong candidate)
      - "8189:8189"     # WebRTC ICE-TCP (dự phòng khi UDP không qua được)
      - "59997:9997"   # API

  fake-cam1:
    build: ./fake-cams
    environment: { CAM: cam1, TARGET: "rtsp://mediamtx:8554/cam-fake1" }
    depends_on: [mediamtx]
    restart: unless-stopped

  fake-cam2:
    build: ./fake-cams
    environment: { CAM: cam2, TARGET: "rtsp://mediamtx:8554/cam-fake2" }
    depends_on: [mediamtx]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aicam-dev
    env_file: [../.env.example]
    environment: &app_env
      LOG_JSON: "true"
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    ports: ["8180:8000"]
    volumes: [video:/data/video, imports:/data/imports]
    depends_on:
      video-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  vision:
    image: aicam-dev
    command: ["python", "-m", "aicam.entrypoints.vision"]
    env_file: [../.env.example]
    environment: *app_env
    depends_on: [api, mediamtx]
    restart: unless-stopped

  worker:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "default,video,sync", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    volumes: [video:/data/video, imports:/data/imports]
    depends_on: [api]

  # Encode bản xuất tách riêng, mỗi lần 1 job: không chặn cắt clip (DEC-32).
  worker-export:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "export", "-c", "1", "-n", "export@%h", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    volumes: [video:/data/video]
    depends_on: [api]

  beat:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.beat", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: [../.env.example]
    environment: *app_env
    depends_on: [api]

volumes:
  pgdata:
  video:
  imports:
