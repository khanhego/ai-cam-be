# Môi trường dev. Port host lệch chuẩn để không đụng dự án khác trên cùng máy.
# Chạy: docker compose -f docker/compose.dev.yml up --build
name: aicam-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aicam
      POSTGRES_USER: aicam
      POSTGRES_PASSWORD: aicam
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicam -d aicam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Volume video thuộc uid 10001 (user `aicam` trong image): worker ghi clip / bản xuất, J-02 xóa video thô.
  # MediaMTX chạy cùng uid để file nó ghi xóa được (T-14).
  video-init:
    image: alpine:3
    # Volume imports: file CSV / xlsx gốc (T-17, API-50/54; J-11 xóa sau 90 ngày).
    # Chỉ chown cấp 1–2 chưa đúng chủ, lỗi chown không chặn mediamtx (G3-P2-7, như compose.yml).
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/video/raw /data/video/clips /data/video/exports /data/video/snapshots /data/imports;
        find /data/video /data/imports -maxdepth 2 ! -user 10001 -exec chown 10001:10001 {} + ||
        echo "CẢNH BÁO video-init: không chown được volume" >&2;
        exit 0
    volumes: [video:/data/video, imports:/data/imports]

  mediamtx:
    image: bluenviron/mediamtx:1
    user: "10001:10001"
    depends_on:
      video-init: { condition: service_completed_successfully }
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - video:/data/video
    ports:
      - "58554:8554"   # RTSP
      - "58889:8889"   # WebRTC / WHEP
      - "8189:8189/udp" # WebRTC ICE (cổng phải trùng trong và ngoài vì nằm trong candidate)
      - "8189:8189"     # WebRTC ICE-TCP (dự phòng khi UDP không qua được)
      - "59997:9997"   # API

  fake-cam1:
    build: ./fake-cams
    environment: { CAM: cam1, TARGET: "rtsp://mediamtx:8554/cam-fake1" }
    depends_on: [mediamtx]
    restart: unless-stopped

  fake-cam2:
    build: ./fake-cams
    environment: { CAM: cam2, TARGET: "rtsp://mediamtx:8554/cam-fake2" }
    depends_on: [mediamtx]
    restart: unless-stopped

  # Kho lưu S3-compatible cho sao lưu + link (02a §7.2, ADR-010). Ảnh `minio/minio` chính thức không còn phát
  # hành trên Docker Hub → bản build cộng đồng `pgsty/minio` (cùng mã MinIO, có sẵn `mc`) — DEC-652.
  # API :59000, console :59001 (root dev: aicamroot / aicamroot-dev-secret).
  minio:
    image: pgsty/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aicamroot
      MINIO_ROOT_PASSWORD: aicamroot-dev-secret
    ports: ["59000:9000", "59001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # Tạo bucket sao lưu (versioning + lifecycle phiên bản cũ 7 ngày) + bucket link + user ứng dụng theo
  # docs/s3-policy.example.json (không xóa phiên bản / không đổi versioning — DEC-501). Chạy lại được.
  minio-init:
    image: pgsty/minio:latest
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: aicamroot
      MINIO_ROOT_PASSWORD: aicamroot-dev-secret
      BACKUP_BUCKET: aicam-dev-backup
      SHARE_BUCKET: aicam-dev-share
      APP_KEY: aicam-app
      APP_SECRET: aicam-app-dev-secret
    volumes:
      - ./minio/init.sh:/init/init.sh:ro
      - ../docs/s3-policy.example.json:/policy/s3-policy.example.json:ro
    depends_on:
      minio: { condition: service_healthy }

  # Một tiến trình uvicorn (G3-F12, docs/ops.md §8).
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aicam-dev
    env_file: [../.env.example]
    environment: &app_env
      LOG_JSON: "true"
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      # Shopee (T-16): mặc định tắt (TC-05.03). QA luồng kết nối bằng adapter mock:
      # `SHOPEE_ENABLED=true docker compose -f docker/compose.dev.yml up -d api worker beat`.
      SHOPEE_ENABLED: ${SHOPEE_ENABLED:-false}
      PLATFORM_ADAPTER: ${PLATFORM_ADAPTER:-mock}
      # Phase 3 (02a §7.2, §9 — T-211): mock Shopee nhiều shop + mock TikTok 2 shop (adapter TikTok thật trên
      # transport giả). Tắt TikTok: `TIKTOK_ENABLED=false`. Áp dụng khi dựng lại stack (không tự đổi container).
      MOCK_SHOPEE_SHOP_IDS: ${MOCK_SHOPEE_SHOP_IDS:-990001,990002}
      TIKTOK_ENABLED: ${TIKTOK_ENABLED:-true}
      TIKTOK_RETURNS_ENABLED: ${TIKTOK_RETURNS_ENABLED:-true}
      TIKTOK_ADAPTER: ${TIKTOK_ADAPTER:-mock}
      # Phase 3 sao lưu cloud + link (02a §7.2, §9, ADR-010): MinIO 2 bucket (minio-init). Kho thật chưa có
      # (Q20). Khóa sao lưu dev cố định (chỉ dev — dữ liệu giả); production: `aicam backup-keygen`.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
      S3_REGION: us-east-1
      S3_BUCKET: aicam-dev-backup
      S3_SHARE_BUCKET: aicam-dev-share
      S3_ADDRESSING_STYLE: path
      S3_ACCESS_KEY_ID: aicam-app
      S3_SECRET_ACCESS_KEY: aicam-app-dev-secret
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-ZGV2LW9ubHktYmFja3VwLWtleS0zMi1ieXRlcyEhISE=}
      BACKUP_OLD_KEYS: ${BACKUP_OLD_KEYS:-}
    ports: ["8180:8000"]
    volumes: [video:/data/video, imports:/data/imports]
    depends_on:
      video-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  vision:
    image: aicam-dev
    command: ["python", "-m", "aicam.entrypoints.vision"]
    env_file: [../.env.example]
    environment: *app_env
    depends_on: [api, mediamtx]
    restart: unless-stopped

  worker:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "default,video", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    volumes: [video:/data/video, imports:/data/imports]
    depends_on: [api]

  # Queue `sync` (Shopee) tách khỏi cắt clip (G3-F11, NFR-03).
  worker-sync:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "sync", "-c", "2", "-n", "sync@%h", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    depends_on: [api]

  # Encode bản xuất tách riêng, mỗi lần 1 job: không chặn cắt clip (DEC-32).
  worker-export:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "export", "-c", "1", "-n", "export@%h", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    volumes: [video:/data/video]
    depends_on: [api]

  # Sao lưu cloud J-20..J-23 (queue `backup`, -c 1 — 02a §9): video / imports chỉ đọc; file dump tạm trong
  # /tmp của container (BACKUP_TMP_DIR). Image có pg_dump 16 (Dockerfile, RB-32).
  worker-backup:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.worker", "worker", "-Q", "backup", "-c", "1", "-n", "backup@%h", "--loglevel", "info"]
    env_file: [../.env.example]
    environment: *app_env
    volumes: ["video:/data/video:ro", "imports:/data/imports:ro"]
    depends_on: [api]

  beat:
    image: aicam-dev
    command: ["celery", "-A", "aicam.entrypoints.beat", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: [../.env.example]
    environment: *app_env
    depends_on: [api]

volumes:
  pgdata:
  video:
  imports:
  minio:
