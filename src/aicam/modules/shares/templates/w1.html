<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src $origin; media-src $origin; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bằng chứng video — Hệ thống X</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1b1c1f;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;min-width:320px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:18px;margin:0 0 8px}
.card{background:#fff;border:1px solid #dde1e6;border-radius:12px;padding:16px;margin:0 0 16px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
dt{color:#5d6168}
dd{margin:0;word-break:break-word}
.expiry{color:#8a4b00;font-weight:600}
.note{color:#8a1c1c;font-weight:600}
video{display:block;width:100%;max-height:70vh;background:#000;border-radius:8px;margin:8px 0}
a.button{display:inline-block;padding:10px 16px;border-radius:20px;background:#0b57d0;color:#fff;text-decoration:none;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.grid img{width:100%;height:140px;object-fit:cover;border-radius:8px;display:block}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
details summary{cursor:pointer;color:#0b57d0}
.muted{color:#5d6168;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Bằng chứng video — Hệ thống X</h1>
<section class="card">
<dl>
<dt>Mã vận đơn</dt><dd>$tracking_number</dd>
<dt>Mã đơn sàn</dt><dd>$platform_order_sn</dd>
<dt>Sàn</dt><dd>$platform</dd>
</dl>
<p class="expiry">Link hết hạn $expires_at (giờ Việt Nam)</p>
</section>
$sessions
$integrity
<p class="muted">Video ghi liên tục, không cắt ghép; chữ trên hình gắn khi xuất.</p>
</main>
</body>
</html>
